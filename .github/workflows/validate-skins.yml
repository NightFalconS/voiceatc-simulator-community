name: Validate Skins Catalog

on:
  pull_request:
    branches:
      - main
    paths:
      - "SKINS/**"
      - "tools/skins_manifest.py"
      - "tools/color_profiles_manifest.py"
      - "tests/test_skins_manifest.py"
      - ".github/workflows/validate-skins.yml"

jobs:
  skins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate skins catalog files
        run: python tools/skins_manifest.py --validate-only
