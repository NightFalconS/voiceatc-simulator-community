name: Format All JSON

on:
  push:
    branches:
      - main
    paths:
      - "**/*.json"
  workflow_dispatch:

permissions:
  contents: write

# Shares the write lock with daily-release.yml so a formatting commit cannot
# land in the middle of a release, between the manifest build and its push.
concurrency:
  group: community-repo-write
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:json
      - name: Commit formatted JSON
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- ':(glob)**/*.json')" ]; then
            echo "No JSON formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(glob)**/*.json'
          git commit -m "chore: format JSON"
          # Contributions push to main directly; rebase and retry instead of
          # failing and leaving unformatted JSON on the branch.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/main"
            git pull --rebase --autostash origin main
            sleep $(( (RANDOM % 5) + attempt ))
          done
          git push
