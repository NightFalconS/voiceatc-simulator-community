name: Validate Visual Procedures

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/visual_procedures.json"
      - "**/visual_go_arounds.json"
      - "**/visual_sight_references.json"
      - "tools/visual_procedures_manifest.py"
      - "tools/visual_go_arounds_manifest.py"
      - "tools/visual_sight_references_manifest.py"
      - "tests/test_visual_procedures_manifest.py"
      - "tests/test_visual_go_arounds_manifest.py"
      - "tests/test_visual_sight_references_manifest.py"
      - ".github/workflows/validate-visual-procedures.yml"

permissions:
  contents: read

jobs:
  visual-procedures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate content hierarchy
        run: python tools/content_hierarchy.py --validate-only
      - name: Validate visual procedure files
        run: python tools/visual_procedures_manifest.py --validate-sources
      - name: Validate visual go-around files
        run: python tools/visual_go_arounds_manifest.py --validate-sources
      - name: Validate visual sight-reference files
        run: python tools/visual_sight_references_manifest.py --validate-sources
